<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b1a">
<title>Credit Debit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style2.css">
</head>
<body>
<header>
  <button class="ib" id="menuBtn" hidden>☰</button>
  <button class="ib" id="backBtn" hidden>←</button>
  <span id="title">Credit Debit</span>
  <button class="ib" id="searchBtn" hidden>🔍</button>
  <button class="ib" id="bellBtn" hidden>🔔</button>
  <button class="ib" id="delBtn" hidden>🗑</button>
  <button class="ib" id="moreBtn" hidden>⋮</button>
</header>

<main>
  <section id="login" class="login">
    <div class="logo">📒</div>
    <h2>Credit Debit</h2>
    <p style="color:var(--sub);margin:0 0 22px">Your digital ledger.<br>Safe in your own Google account.</p>
    <button class="btn full" id="loginBtn">Continue with Google</button>
  </section>

  <section id="home" hidden>
    <div class="hero home-hero">
      <small>Net balance</small>
      <b class="big" id="sBal">0</b>
      <div class="pills">
        <div class="pill"><small>Total Due</small><b id="sDue" style="color:#ffd1d9">0</b></div>
        <div class="pill"><small>Total Advance</small><b id="sAdv" style="color:#b8f5e1">0</b></div>
      </div>
    </div>
    <div class="search" id="searchBox" hidden><span>🔍</span><input id="search" placeholder="Search customers"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="acc" hidden>
    <div class="hero">
      <div class="av big" id="accAv"></div>
      <small id="accCat"></small>
      <b class="big" id="accBal" style="margin-bottom:2px">0</b>
      <small id="accStatus"></small>
      <div class="actions">
        <button id="call">📞 Call</button>
        <button id="remind">🔔 Remind</button>
        <button id="export">📄 Export</button>
      </div>
    </div>
    <div class="trow">
      <b>Transactions <span id="tCount">0</span></b>
      <label class="tg">Balance <input type="checkbox" id="balTog" checked><span class="sw"></span></label>
    </div>
    <div class="chips" id="pChips"></div>
    <div class="tbl" id="tbl">
      <div class="th"><span>Date</span><span class="gr green">Received</span><span class="rd red">Gave</span><span class="bc">Balance</span></div>
      <div id="txList"></div>
    </div>
  </section>

  <section id="txs" hidden>
    <div class="hero"><small>Total entries</small><b class="big" id="txCount" style="margin-bottom:0">0</b></div>
    <div id="txsList"></div>
  </section>

  <section id="cash" hidden>
    <div class="hero">
      <small>Cash balance</small><b class="big" id="cBal">0</b>
      <div class="pills">
        <div class="pill"><small>Cash In</small><b id="cIn" style="color:#b8f5e1">0</b></div>
        <div class="pill"><small>Cash Out</small><b id="cOut" style="color:#ffd1d9">0</b></div>
      </div>
    </div>
    <div id="cashList"></div>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div class="acts">
    <button class="btn soft" id="txBtn">☰ Transactions</button>
    <button class="btn" id="addBtn">👤＋ Add Customer</button>
  </div>
  <div class="sum">
    <div><small>Total Advance</small><b class="green" id="dAdv">0</b></div>
    <div><small>Total Due</small><b class="red" id="dDue">0</b></div>
    <div><small>Balance</small><b id="dBal">0</b></div>
  </div>
  <nav class="nav">
    <button id="nTransfer"><i>⇄</i>Transfer</button>
    <button id="nCash"><i>💵</i>Cash Book</button>
    <button id="nCalc"><i>🧮</i>Calculator</button>
    <button id="nMore"><i>⋮</i>More</button>
  </nav>
</div>

<div class="bar" id="bar" hidden>
  <div class="acts">
    <button class="btn grn" id="gotBtn">You Received</button>
    <button class="btn red" id="gaveBtn">You Gave</button>
  </div>
  <div class="sum">
    <div><small>Total Received</small><b class="green" id="tRec">0</b></div>
    <div><small>Total Given</small><b class="red" id="tGiv">0</b></div>
    <div><small>Balance</small><b id="tBal">0</b></div>
  </div>
</div>
<div class="bar" id="cbar" hidden>
  <div class="acts">
    <button class="btn grn" id="cashIn">Cash In</button>
    <button class="btn red" id="cashOut">Cash Out</button>
  </div>
</div>

<div class="dov" id="dov"><aside id="drawer">
  <div class="dhead"><div class="av big" id="dAv"></div><b id="dName"></b><small id="dMail"></small></div>
  <button class="mi" data-go="home">🏠 Home</button>
  <button class="mi" data-go="txs">🧾 Transactions</button>
  <button class="mi" data-go="cash">💵 Cash Book</button>
  <button class="mi" data-go="calc">🧮 Cash Calculator</button>
  <button class="mi" data-go="theme">🌓 Dark / Light mode</button>
  <button class="mi" data-go="logout">⎋ Logout</button>
</aside></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
