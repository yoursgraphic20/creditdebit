<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Credit Debit</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#111827;--sub:#6b7280;--pri:#4f46e5;--pri2:#7c3aed;--green:#16a34a;--red:#dc2626;--line:#e5e7eb;--inp:#f3f4f6}
[data-theme=dark]{--bg:#0b1020;--card:#161d33;--text:#f3f4f6;--sub:#9ca3af;--line:#262f4a;--inp:#1e2742}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;gap:6px;padding:10px 12px}
header #title{flex:1;font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{background:#ffffff26;color:#fff;border:0;border-radius:10px;width:38px;height:38px;font-size:17px}
main{max-width:640px;margin:0 auto;padding:12px 14px 290px}
.green,.g{color:var(--green)}.red{color:var(--red)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin:0 0 10px;border:1px solid var(--line)}
.search input{border:0;background:transparent;color:var(--text);flex:1;padding:13px 0;font-size:16px;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex:0 0 auto}
.av.big{width:64px;height:64px;font-size:28px;margin:0 auto 8px;background:#ffffff33!important}
.item .nm{flex:1;min-width:0}
.item .nm b,.item .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--sub);font-size:12.5px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 8px 24px #4f46e540;margin-bottom:6px}
.hero small{color:#ffffffcc;display:block}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:10px 4px;font-size:14px}
.amt{text-align:right}.amt b{display:block;font-size:17px}
.btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--pri);color:#fff}
.btn.red{background:var(--red);color:#fff}.btn.grn{background:var(--green);color:#fff}
.btn.ghost{background:var(--inp);color:var(--text)}
.btn.soft{background:#4f46e51f;color:var(--pri)}
.btn.full{width:100%}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(6px + env(safe-area-inset-bottom));z-index:6}
.dock>*{max-width:640px;margin-left:auto;margin-right:auto}
.acts{display:flex;gap:10px}.acts .btn{flex:1;padding:12px;font-size:15px}
.sum{display:flex;gap:8px;margin-top:10px;margin-bottom:6px}
.sum div{flex:1;text-align:center;background:var(--inp);border-radius:12px;padding:8px 4px}
.sum b{display:block;font-size:17px}
.nav{display:flex;border-top:1px solid var(--line);padding-top:6px}
.nav button{flex:1;background:none;border:0;color:var(--text);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.nav i{font-style:normal;font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;z-index:6}
.bar button{flex:1;max-width:300px}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px;margin:9px 0;border:1px solid var(--line)}
.dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.dot.gave,.dot.out{background:#dc262622;color:var(--red)}.dot.got,.dot.in{background:#16a34a22;color:var(--green)}
.tm{flex:1;min-width:0}.tm b,.tm small{display:block}
.ta{font-weight:700}
.ib2{background:var(--inp);border:0;border-radius:8px;width:32px;height:32px;margin-left:4px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.login{text-align:center;margin-top:60px;background:var(--card);padding:34px 20px;border-radius:22px;border:1px solid var(--line)}
.login .logo{font-size:56px}
.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(40px);transition:transform .25s}
.overlay.open .sheet{transform:none}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 12px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.sheet input{width:100%;padding:13px;border:1px solid var(--line);background:var(--inp);color:var(--text);border-radius:12px;font-size:16px;outline:0}
.sheet input.bigin{font-size:30px;font-weight:700;text-align:center}
.two{display:flex;gap:10px;margin-top:16px}.two .btn{flex:1}
.mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font-size:16px;padding:15px 6px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:24px;z-index:40;font-size:14px;max-width:90%}
.dov{position:fixed;inset:0;background:#0008;z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
.dov.open{opacity:1;pointer-events:auto}
#drawer{width:280px;max-width:82%;height:100%;background:var(--card);transform:translateX(-100%);transition:transform .25s}
.dov.open #drawer{transform:none}
.dhead{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:26px 18px;margin-bottom:6px}
.dhead small{color:#ffffffcc;display:block}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cg button{padding:16px 0;font-size:20px;border:0;border-radius:12px;background:var(--inp);color:var(--text)}
.cg button.op{background:#4f46e51f;color:var(--pri)}
.cg button.eq{background:var(--pri);color:#fff}
.cdisp{text-align:right;background:var(--inp);border-radius:12px;padding:12px}
.cdisp small{display:block;min-height:16px}.cdisp b{font-size:34px;word-break:break-all}
</style>
</head>
<body>
<header>
  <button class="ib" id="menuBtn" hidden>☰</button>
  <button class="ib" id="backBtn" hidden>←</button>
  <span id="title">Credit Debit</span>
  <button class="ib" id="searchBtn" hidden>🔍</button>
  <button class="ib" id="bellBtn" hidden>🔔</button>
  <button class="ib" id="delBtn" hidden>🗑</button>
  <button class="ib" id="moreBtn" hidden>⋮</button>
</header>

<main>
  <section id="login" class="login">
    <div class="logo">📒</div>
    <h2>Credit Debit</h2>
    <p style="color:var(--sub)">Your digital ledger.<br>Safe in your own Google account.</p>
    <button class="btn full" id="loginBtn">Sign in with Google</button>
  </section>

  <section id="home" hidden>
    <div class="search" id="searchBox" hidden><span>🔍</span><input id="search" placeholder="Search customers"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="acc" hidden>
    <div class="hero">
      <div class="av big" id="accAv"></div>
      <small id="accCat"></small>
      <div><b id="accBal" style="font-size:34px">0</b></div>
      <small id="accStatus"></small>
      <div class="actions">
        <button id="call">📞 Call</button>
        <button id="remind">🔔 Remind</button>
        <button id="export">📄 Export</button>
      </div>
    </div>
    <div id="txList"></div>
  </section>

  <section id="txs" hidden>
    <div class="hero"><small>Total entries</small><b id="txCount" style="font-size:30px">0</b></div>
    <div id="txsList"></div>
  </section>

  <section id="cash" hidden>
    <div class="hero">
      <small>Cash balance</small><b id="cBal" style="font-size:34px">0</b>
      <div class="actions" style="pointer-events:none">
        <button>⬇ In: <span id="cIn">0</span></button>
        <button>⬆ Out: <span id="cOut">0</span></button>
      </div>
    </div>
    <div id="cashList"></div>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div class="acts">
    <button class="btn soft" id="txBtn">☰ Transactions</button>
    <button class="btn" id="addBtn">👤＋ Add Customer</button>
  </div>
  <div class="sum">
    <div><small>Total Advance</small><b class="green" id="sAdv">0</b></div>
    <div><small>Total Due</small><b class="red" id="sDue">0</b></div>
    <div><small>Balance</small><b id="sBal">0</b></div>
  </div>
  <nav class="nav">
    <button id="nTransfer"><i>⇄</i>Transfer</button>
    <button id="nCash"><i>💵</i>Cash Book</button>
    <button id="nCalc"><i>🧮</i>Cash Calculator</button>
    <button id="nMore"><i>⋮</i>More Options</button>
  </nav>
</div>

<div class="bar" id="bar" hidden>
  <button class="btn red" id="gaveBtn">You Gave</button>
  <button class="btn grn" id="gotBtn">You Got</button>
</div>
<div class="bar" id="cbar" hidden>
  <button class="btn grn" id="cashIn">Cash In</button>
  <button class="btn red" id="cashOut">Cash Out</button>
</div>

<div class="dov" id="dov"><aside id="drawer">
  <div class="dhead"><div class="av big" id="dAv"></div><b id="dName"></b><small id="dMail"></small></div>
  <button class="mi" data-go="home">🏠 Home</button>
  <button class="mi" data-go="txs">🧾 Transactions</button>
  <button class="mi" data-go="cash">💵 Cash Book</button>
  <button class="mi" data-go="calc">🧮 Cash Calculator</button>
  <button class="mi" data-go="theme">🌓 Dark / Light mode</button>
  <button class="mi" data-go="logout">⎋ Logout</button>
</aside></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, increment, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAyKcFsblntjAqSD58Q15a1ZHDjjRpsMw",
  authDomain: "creditdebit-app-a33c8.firebaseapp.com",
  projectId: "creditdebit-app-a33c8",
  storageBucket: "creditdebit-app-a33c8.firebasestorage.app",
  messagingSenderId: "782522431758",
  appId: "1:782522431758:web:677034a42d3a62f91eff5f"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("en-IN");
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const nowLocal = () => { const n = new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset()); return n.toISOString().slice(0, 16); };
const color = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},55%,45%)`; };
const initial = s => (s || "?").trim().charAt(0).toUpperCase();

let accounts = [], txns = [], cash = [], allTx = [];
let cur = null, unsubA = null, unsubT = null, unsubC = null, filter = "all", catSel = "";

/* theme */
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("theme", t); } catch (e) {}
}
function toggleTheme() { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* helpers */
const uid = () => auth.currentUser.uid;
const accCol = () => collection(db, "users", uid(), "accounts");
const accRef = id => doc(db, "users", uid(), "accounts", id);
const txCol = () => collection(db, "users", uid(), "accounts", cur, "txns");
const cashCol = () => collection(db, "users", uid(), "cashbook");
function curAcc() { return accounts.find(x => x.id === cur); }

function toast(m) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function openSheet(html) { $("sheet").onclick = null; $("sheet").innerHTML = html; $("overlay").classList.add("open"); }
function closeSheet() { $("overlay").classList.remove("open"); }
$("overlay").onclick = e => { if (e.target === $("overlay")) closeSheet(); };
function confirmBox(msg, okText, fn) {
  openSheet(`<h3>${esc(msg)}</h3><div class="two"><button class="btn ghost" id="no">Cancel</button><button class="btn red" id="yes">${okText}</button></div>`);
  $("no").onclick = closeSheet;
  $("yes").onclick = async () => { closeSheet(); await fn(); };
}
function download(name, csv) {
  const l = document.createElement("a");
  l.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  l.download = name; l.click();
}

/* drawer */
function openDrawer() { $("dov").classList.add("open"); }
function closeDrawer() { $("dov").classList.remove("open"); }
$("menuBtn").onclick = openDrawer;
$("dov").onclick = e => {
  if (e.target === $("dov")) return closeDrawer();
  const b = e.target.closest("[data-go]");
  if (!b) return;
  closeDrawer();
  const k = b.dataset.go;
  if (k === "home") goHome();
  if (k === "txs") openTxs();
  if (k === "cash") openCash();
  if (k === "calc") calcSheet();
  if (k === "theme") toggleTheme();
  if (k === "logout") confirmBox("Logout from your account?", "Logout", () => signOut(auth));
};

/* views */
function view(name) {
  ["login", "home", "acc", "txs", "cash"].forEach(v => $(v).hidden = v !== name);
  $("dock").hidden = name !== "home";
  $("bar").hidden = name !== "acc";
  $("cbar").hidden = name !== "cash";
  const home = name === "home", sub = ["acc", "txs", "cash"].includes(name);
  $("menuBtn").hidden = !home; $("searchBtn").hidden = !home;
  $("bellBtn").hidden = !home; $("moreBtn").hidden = !home;
  $("backBtn").hidden = !sub; $("delBtn").hidden = name !== "acc";
  $("title").textContent = name === "txs" ? "Transactions" : name === "cash" ? "Cash Book" : name === "acc" ? (curAcc() ? curAcc().name : "") : "Credit Debit";
}
function goHome() {
  cur = null;
  if (unsubT) { unsubT(); unsubT = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  view("home");
}
$("backBtn").onclick = goHome;

/* auth */
$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { toast("Login error: " + e.message); }
};
onAuthStateChanged(auth, user => {
  if (unsubA) unsubA();
  if (unsubT) unsubT();
  if (unsubC) unsubC();
  cur = null;
  if (!user) return view("login");
  $("dName").textContent = user.displayName || "";
  $("dMail").textContent = user.email || "";
  $("dAv").textContent = initial(user.displayName);
  $("dAv").style.background = "#ffffff33";
  view("home");
  unsubA = onSnapshot(query(accCol(), orderBy("name")), snap => {
    accounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderHome();
    if (cur) renderAcc();
  });
});

/* home */
function renderHome() {
  let due = 0, adv = 0;
  accounts.forEach(a => { const b = a.balance || 0; if (b > 0) due += b; else adv -= b; });
  $("sDue").textContent = money(due);
  $("sAdv").textContent = money(adv);
  const bal = due - adv;
  $("sBal").textContent = (bal < 0 ? "-" : "") + money(Math.abs(bal));
  const cats = [...new Set(accounts.map(a => a.category).filter(Boolean))];
  if (catSel && !cats.includes(catSel)) catSel = "";
  const chips = [["all", "All"], ["due", "Due"], ["advance", "Advance"], ["settled", "Settled"], ["cat", (catSel || "Category") + " ▾"]];
  $("chips").innerHTML = chips.map(([k, l]) =>
    `<button class="chip ${(k === "cat" ? !!catSel : k === filter) ? "on" : ""}" data-f="${k}">${esc(l)}</button>`).join("");
  const s = $("search").value.toLowerCase();
  const rows = accounts.filter(a => {
    const b = a.balance || 0;
    if (filter === "due" && !(b > 0)) return false;
    if (filter === "advance" && !(b < 0)) return false;
    if (filter === "settled" && b !== 0) return false;
    if (catSel && a.category !== catSel) return false;
    if (s && !a.name.toLowerCase().includes(s)) return false;
    return true;
  });
  $("list").innerHTML = rows.map(a => {
    const b = a.balance || 0;
    return `<div class="item" data-open="${a.id}">
      <div class="av" style="background:${color(a.name)}">${esc(initial(a.name))}</div>
      <div class="nm"><b>${esc(a.name)}</b><small>${esc(a.category || "No category")}</small></div>
      <div class="amt"><b class="${b > 0 ? "red" : b < 0 ? "green" : ""}">${money(Math.abs(b))}</b><small>${b > 0 ? "Due" : b < 0 ? "Advance" : "Settled"}</small></div></div>`;
  }).join("") || `<div class="empty">📭<br>No customers here.<br>Tap <b>Add Customer</b> to start.</div>`;
}
$("search").oninput = renderHome;
$("searchBtn").onclick = () => {
  $("searchBox").hidden = !$("searchBox").hidden;
  if (!$("searchBox").hidden) $("search").focus(); else { $("search").value = ""; renderHome(); }
};
$("chips").onclick = e => {
  const c = e.target.closest("[data-f]");
  if (!c) return;
  const k = c.dataset.f;
  if (k === "cat") {
    const cats = [...new Set(accounts.map(a => a.category).filter(Boolean))];
    openSheet(`<h3>Category</h3><button class="mi" data-c="">All categories</button>` +
      cats.map(x => `<button class="mi" data-c="${esc(x)}">${esc(x)}</button>`).join("") +
      (cats.length ? "" : `<div class="empty">No categories yet. Add one when creating a customer.</div>`));
    $("sheet").onclick = ev => { const b = ev.target.closest("[data-c]"); if (b) { catSel = b.dataset.c; closeSheet(); renderHome(); } };
  } else { filter = k; renderHome(); }
};
$("list").onclick = e => { const el = e.target.closest("[data-open]"); if (el) openAcc(el.dataset.open); };

/* add customer popup */
$("addBtn").onclick = () => {
  const cats = [...new Set(accounts.map(a => a.category).filter(Boolean))];
  openSheet(`<h3>Add customer</h3>
    <button class="btn ghost full" id="pick">📇 Pick from contacts</button>
    <label>Name</label><input id="aName" placeholder="Customer / supplier name">
    <label>Phone</label><input id="aPhone" type="tel" placeholder="With country code, e.g. 919876543210">
    <label>Category</label><input id="aCat" list="catlist" placeholder="Customer, supplier, shop...">
    <datalist id="catlist">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <div class="two"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="ok">Save</button></div>`);
  $("x").onclick = closeSheet;
  $("pick").onclick = async () => {
    if (!("contacts" in navigator && "ContactsManager" in window)) return toast("Contact picker not supported on this device");
    try {
      const [c] = await navigator.contacts.select(["name", "tel"], { multiple: false });
      if (!c) return;
      $("aName").value = (c.name && c.name[0]) || "";
      $("aPhone").value = ((c.tel && c.tel[0]) || "").replace(/[^\d+]/g, "");
    } catch (e) { toast("Could not open contacts"); }
  };
  $("ok").onclick = async () => {
    const name = $("aName").value.trim();
    if (!name) return toast("Enter a name");
    await addDoc(accCol(), { name, phone: $("aPhone").value.trim(), category: $("aCat").value.trim(), balance: 0, createdAt: serverTimestamp() });
    closeSheet(); toast("Customer added");
  };
};

/* account page */
function openAcc(id) {
  cur = id;
  if (unsubT) unsubT();
  view("acc");
  unsubT = onSnapshot(query(txCol(), orderBy("date", "desc")), snap => {
    txns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAcc();
  });
  renderAcc();
}
function renderAcc() {
  const a = curAcc();
  if (!a) return goHome();
  const b = a.balance || 0;
  $("title").textContent = a.name;
  $("accAv").textContent = initial(a.name);
  $("accCat").textContent = a.category || "";
  $("accBal").textContent = money(Math.abs(b));
  $("accStatus").textContent = b > 0 ? "Due: they owe you" : b < 0 ? "Advance: you owe them" : "All settled";
  $("txList").innerHTML = txns.map(t => `<div class="tx">
    <div class="dot ${t.type}">${t.type === "gave" ? "↑" : "↓"}</div>
    <div class="tm"><b>${t.type === "gave" ? "You Gave" : "You Got"}</b><small>${esc(fmt(t.date))}</small>${t.note ? `<small>${esc(t.note)}</small>` : ""}</div>
    <div class="ta ${t.type === "gave" ? "red" : "green"}">${money(t.amount)}</div>
    <div><button class="ib2" data-edit="${t.id}">✏️</button><button class="ib2" data-del="${t.id}">🗑</button></div></div>`).join("")
    || `<div class="empty">📝<br>No entries yet.<br>Use the buttons below.</div>`;
}

function txSheet(type, t) {
  const edit = !!t;
  let dv = edit ? (t.date || "") : nowLocal();
  if (dv.length === 10) dv += "T00:00";
  openSheet(`<h3 class="${type === "gave" ? "red" : "green"}">${edit ? "Edit entry" : type === "gave" ? "You Gave" : "You Got"}</h3>
    <input id="tAmount" class="bigin" type="number" inputmode="decimal" placeholder="0" value="${edit ? t.amount : ""}">
    <label>Note</label><input id="tNote" placeholder="Optional" value="${esc(edit ? t.note : "")}">
    <label>Date and time</label><input id="tDate" type="datetime-local" value="${dv}">
    <div class="two"><button class="btn ghost" id="x">Cancel</button><button class="btn ${type === "gave" ? "red" : "grn"}" id="ok">Save</button></div>`);
  $("x").onclick = closeSheet;
  setTimeout(() => $("tAmount").focus(), 300);
  $("ok").onclick = async () => {
    const amt = parseFloat($("tAmount").value);
    if (!amt || amt <= 0) return toast("Enter a valid amount");
    const note = $("tNote").value.trim(), date = $("tDate").value || nowLocal();
    const b = writeBatch(db);
    if (edit) {
      b.update(doc(txCol(), t.id), { amount: amt, note, date });
      b.update(accRef(cur), { balance: increment((t.type === "gave" ? 1 : -1) * (amt - t.amount)) });
    } else {
      b.set(doc(txCol()), { amount: amt, type, note, date, createdAt: serverTimestamp() });
      b.update(accRef(cur), { balance: increment(type === "gave" ? amt : -amt) });
    }
    await b.commit();
    closeSheet(); toast(edit ? "Entry updated" : "Entry saved");
  };
}
$("gaveBtn").onclick = () => txSheet("gave");
$("gotBtn").onclick = () => txSheet("got");

$("txList").onclick = e => {
  const del = e.target.closest("[data-del]"), ed = e.target.closest("[data-edit]");
  if (ed) { const t = txns.find(x => x.id === ed.dataset.edit); txSheet(t.type, t); }
  if (del) {
    const t = txns.find(x => x.id === del.dataset.del);
    confirmBox("Delete this entry?", "Delete", async () => {
      const b = writeBatch(db);
      b.delete(doc(txCol(), t.id));
      b.update(accRef(cur), { balance: increment(t.type === "gave" ? -t.amount : t.amount) });
      await b.commit();
      toast("Entry deleted");
    });
  }
};
$("delBtn").onclick = () => confirmBox("Delete this customer and all entries?", "Delete", async () => {
  const id = cur;
  const snap = await getDocs(txCol());
  const b = writeBatch(db);
  snap.forEach(d => b.delete(d.ref));
  b.delete(accRef(id));
  await b.commit();
  goHome(); toast("Customer deleted");
});

function remindAcc(a) {
  if (!a.phone) return toast("Add a phone number first");
  const msg = `Hello ${a.name}, your pending balance is ${money(Math.abs(a.balance || 0))}. Please pay soon. Thank you.`;
  window.open("https://wa.me/" + a.phone.replace(/\D/g, "") + "?text=" + encodeURIComponent(msg));
}
$("call").onclick = () => {
  const a = curAcc();
  if (!a.phone) return toast("Add a phone number first");
  location.href = "tel:" + a.phone;
};
$("remind").onclick = () => remindAcc(curAcc());
$("export").onclick = () => {
  const a = curAcc();
  let csv = "Date,Type,Amount,Note\n";
  [...txns].reverse().forEach(t => csv += `${t.date},${t.type === "gave" ? "You Gave" : "You Got"},${t.amount},"${(t.note || "").replace(/"/g, '""')}"\n`);
  download(a.name + ".csv", csv);
};

/* all transactions */
async function openTxs() {
  view("txs");
  $("txsList").innerHTML = `<div class="empty">Loading...</div>`;
  try {
    const res = await Promise.all(accounts.map(async a => {
      const s = await getDocs(collection(db, "users", uid(), "accounts", a.id, "txns"));
      return s.docs.map(d => ({ id: d.id, acc: a, ...d.data() }));
    }));
    allTx = res.flat().sort((x, y) => (y.date || "").localeCompare(x.date || ""));
  } catch (e) { allTx = []; toast("Could not load transactions"); }
  $("txCount").textContent = allTx.length;
  $("txsList").innerHTML = allTx.map(t => `<div class="tx" data-acc="${t.acc.id}">
    <div class="dot ${t.type}">${t.type === "gave" ? "↑" : "↓"}</div>
    <div class="tm"><b>${esc(t.acc.name)}</b><small>${t.type === "gave" ? "You Gave" : "You Got"} · ${esc(fmt(t.date))}</small>${t.note ? `<small>${esc(t.note)}</small>` : ""}</div>
    <div class="ta ${t.type === "gave" ? "red" : "green"}">${money(t.amount)}</div></div>`).join("")
    || `<div class="empty">🧾<br>No transactions yet.</div>`;
}
$("txsList").onclick = e => { const el = e.target.closest("[data-acc]"); if (el) openAcc(el.dataset.acc); };
$("txBtn").onclick = openTxs;

/* cash book */
function openCash() {
  if (unsubC) unsubC();
  view("cash");
  unsubC = onSnapshot(query(cashCol(), orderBy("date", "desc")), snap => {
    cash = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCash();
  });
}
function renderCash() {
  let i = 0, o = 0;
  cash.forEach(c => { if (c.type === "in") i += c.amount; else o += c.amount; });
  $("cIn").textContent = money(i); $("cOut").textContent = money(o);
  $("cBal").textContent = (i - o < 0 ? "-" : "") + money(Math.abs(i - o));
  $("cashList").innerHTML = cash.map(c => `<div class="tx">
    <div class="dot ${c.type}">${c.type === "in" ? "↓" : "↑"}</div>
    <div class="tm"><b>${c.type === "in" ? "Cash In" : "Cash Out"}</b><small>${esc(fmt(c.date))}</small>${c.note ? `<small>${esc(c.note)}</small>` : ""}</div>
    <div class="ta ${c.type === "in" ? "green" : "red"}">${money(c.amount)}</div>
    <div><button class="ib2" data-cedit="${c.id}">✏️</button><button class="ib2" data-cdel="${c.id}">🗑</button></div></div>`).join("")
    || `<div class="empty">💵<br>No cash entries yet.</div>`;
}
function cashSheet(type, e) {
  const edit = !!e;
  let dv = edit ? (e.date || "") : nowLocal();
  if (dv.length === 10) dv += "T00:00";
  openSheet(`<h3 class="${type === "in" ? "green" : "red"}">${edit ? "Edit entry" : type === "in" ? "Cash In" : "Cash Out"}</h3>
    <input id="tAmount" class="bigin" type="number" inputmode="decimal" placeholder="0" value="${edit ? e.amount : ""}">
    <label>Note</label><input id="tNote" placeholder="Optional" value="${esc(edit ? e.note : "")}">
    <label>Date and time</label><input id="tDate" type="datetime-local" value="${dv}">
    <div class="two"><button class="btn ghost" id="x">Cancel</button><button class="btn ${type === "in" ? "grn" : "red"}" id="ok">Save</button></div>`);
  $("x").onclick = closeSheet;
  setTimeout(() => $("tAmount").focus(), 300);
  $("ok").onclick = async () => {
    const amt = parseFloat($("tAmount").value);
    if (!amt || amt <= 0) return toast("Enter a valid amount");
    const data = { amount: amt, type, note: $("tNote").value.trim(), date: $("tDate").value || nowLocal() };
    if (edit) await updateDoc(doc(cashCol(), e.id), data);
    else await addDoc(cashCol(), { ...data, createdAt: serverTimestamp() });
    closeSheet(); toast("Saved");
  };
}
$("cashIn").onclick = () => cashSheet("in");
$("cashOut").onclick = () => cashSheet("out");
$("cashList").onclick = e => {
  const ed = e.target.closest("[data-cedit]"), del = e.target.closest("[data-cdel]");
  if (ed) { const c = cash.find(x => x.id === ed.dataset.cedit); cashSheet(c.type, c); }
  if (del) confirmBox("Delete this entry?", "Delete", async () => {
    await deleteDoc(doc(cashCol(), del.dataset.cdel)); toast("Entry deleted");
  });
};
$("nCash").onclick = openCash;

/* calculator */
function calcSheet() {
  let cur = "0", acc = null, op = null, fresh = true;
  const keys = ["C","⌫","÷","×","7","8","9","−","4","5","6","+","1","2","3","=","0",".","00"];
  openSheet(`<h3>Cash Calculator</h3>
    <div class="cdisp"><small id="cx"></small><b id="cd">0</b></div>
    <div class="cg">${keys.map(k => `<button class="${"÷×−+".includes(k) ? "op" : k === "=" ? "eq" : ""}" data-k="${k}">${k}</button>`).join("")}</div>
    <div class="two"><button class="btn ghost" id="x">Close</button></div>`);
  $("x").onclick = closeSheet;
  const upd = () => { $("cd").textContent = cur; $("cx").textContent = acc !== null && op ? `${acc} ${op}` : ""; };
  const calc = () => {
    if (op === null || acc === null) return;
    const a = acc, b = parseFloat(cur);
    let r = op === "+" ? a + b : op === "−" ? a - b : op === "×" ? a * b : (b === 0 ? 0 : a / b);
    cur = String(Math.round(r * 1e8) / 1e8);
  };
  $("sheet").onclick = e => {
    const b = e.target.closest("[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    if (k === "C") { cur = "0"; acc = null; op = null; fresh = true; }
    else if (k === "⌫") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; }
    else if ("+−×÷".includes(k)) { if (op !== null && !fresh) calc(); acc = parseFloat(cur); op = k; fresh = true; }
    else if (k === "=") { calc(); acc = null; op = null; fresh = true; }
    else if (k === ".") { if (fresh) { cur = "0."; fresh = false; } else if (!cur.includes(".")) cur += "."; }
    else { if (fresh) { cur = k === "00" ? "0" : k; fresh = false; } else cur = cur === "0" ? (k === "00" ? "0" : k) : cur + k; }
    upd();
  };
}
$("nCalc").onclick = calcSheet;

/* reminders (bell) */
$("bellBtn").onclick = () => {
  const dues = accounts.filter(a => (a.balance || 0) > 0).sort((x, y) => y.balance - x.balance);
  openSheet(`<h3>🔔 Payment reminders</h3>` + (dues.length ? dues.map(a => `<div class="item" style="margin:8px 0">
    <div class="av" style="background:${color(a.name)}">${esc(initial(a.name))}</div>
    <div class="nm"><b>${esc(a.name)}</b><small class="red">Due ${money(a.balance)}</small></div>
    <button class="btn" data-wa="${a.id}" style="padding:9px 14px;font-size:14px">WhatsApp</button></div>`).join("")
    : `<div class="empty">🎉 No pending dues</div>`) + `<div class="two"><button class="btn ghost" id="x">Close</button></div>`);
  $("x").onclick = closeSheet;
  $("sheet").onclick = e => { const b = e.target.closest("[data-wa]"); if (b) remindAcc(accounts.find(a => a.id === b.dataset.wa)); };
};

/* more options + transfer */
function moreSheet() {
  openSheet(`<h3>More options</h3>
    <button class="mi" data-m="export">📄 Export all customers (CSV)</button>
    <button class="mi" data-m="theme">🌓 Dark / Light mode</button>
    <button class="mi" data-m="backup">☁️ Backup info</button>
    <button class="mi" data-m="logout">⎋ Logout</button>`);
  $("sheet").onclick = e => {
    const b = e.target.closest("[data-m]");
    if (!b) return;
    const k = b.dataset.m;
    if (k === "export") {
      let csv = "Name,Phone,Category,Balance\n";
      accounts.forEach(a => csv += `"${(a.name || "").replace(/"/g, '""')}",${a.phone || ""},"${(a.category || "").replace(/"/g, '""')}",${a.balance || 0}\n`);
      closeSheet(); download("all-customers.csv", csv);
    }
    if (k === "theme") { toggleTheme(); closeSheet(); }
    if (k === "backup") { closeSheet(); toast("Your data is saved automatically in your Google account's cloud"); }
    if (k === "logout") confirmBox("Logout from your account?", "Logout", () => signOut(auth));
  };
}
$("moreBtn").onclick = moreSheet;
$("nMore").onclick = moreSheet;
$("nTransfer").onclick = () => toast("Transfer is coming soon");
</script>
