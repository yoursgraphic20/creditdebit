<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b1a">
<title>Credit Debit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fb;--card:#ffffffd9;--text:#0f172a;--sub:#64748b;--pri:#6366f1;--pri2:#22d3ee;--green:#10b981;--red:#f43f5e;--line:#e2e8f0;--inp:#eef1f8;--shadow:0 10px 28px #6366f11f;--glass:#fffffff2}
[data-theme=dark]{--bg:#070b1a;--card:#ffffff0d;--text:#f1f5f9;--sub:#8b97b1;--line:#ffffff17;--inp:#ffffff12;--shadow:0 10px 30px #0006;--glass:#0d1329ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% -8%,#6366f155,transparent 45%),radial-gradient(circle at 100% 12%,#22d3ee30,transparent 40%),radial-gradient(circle at 50% 110%,#a855f733,transparent 45%)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header #title{flex:1;font-weight:800;font-size:20px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:17px}
main{max-width:640px;margin:0 auto;padding:14px 14px 210px}
.green,.g{color:var(--green)}.red{color:var(--red)}
small{color:var(--sub);font-size:12.5px;font-weight:500}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;text-align:center;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 48%,#0ea5e9 100%);box-shadow:0 18px 40px #4f46e55c;margin-bottom:8px}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#ffffff1f;top:-70px;right:-50px}
.hero::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff14;bottom:-50px;left:-30px}
.hero>*{position:relative;z-index:1}
.hero small{color:#ffffffcc;display:block}
.hero .big{display:block;font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:2px 0 12px}
.home-hero{text-align:left}
.pills{display:flex;gap:10px}
.pill{flex:1;background:#ffffff24;border:1px solid #ffffff2e;border-radius:16px;padding:10px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill b{display:block;font-size:19px;font-weight:700}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;background:#ffffff26;color:#fff;border:1px solid #ffffff2e;border-radius:14px;padding:11px 4px;font-size:14px;font-weight:600;font-family:inherit}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;margin:12px 0;border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.search input{border:0;background:transparent;color:var(--text);flex:1;padding:14px 0;font-size:16px;outline:0;font-family:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 17px;border-radius:22px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px;font-weight:600;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 6px 16px #6366f155}

.item,.tx{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.item{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:20px;padding:13px;margin:10px 0;border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.item:active{transform:scale(.985)}
.av{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;flex:0 0 auto;box-shadow:0 6px 14px #0003}
.av.big{width:68px;height:68px;font-size:30px;border-radius:22px;margin:0 auto 8px;background:#ffffff33!important;box-shadow:none}
.item .nm{flex:1;min-width:0}
.item .nm b,.item .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm b{font-weight:700;font-size:16px}
.amt{text-align:right}.amt b{display:block;font-size:18px;font-weight:800}

.btn{border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--pri),#8b5cf6);box-shadow:0 8px 20px #6366f155}
.btn.red{background:linear-gradient(135deg,#f43f5e,#fb7185);box-shadow:0 8px 20px #f43f5e55}
.btn.grn{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 8px 20px #10b98155}
.btn.ghost{background:var(--inp);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--inp);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:12px 14px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0004}
.dock>*{max-width:640px;margin-left:auto;margin-right:auto}
.acts{display:flex;gap:10px}.acts .btn{flex:1;padding:13px;font-size:15px}
.nav{display:flex;margin-top:8px;padding-top:6px}
.nav button{flex:1;background:none;border:0;color:var(--sub);font-size:11.5px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
.nav i{font-style:normal;font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center}
.bar button{flex:1;max-width:300px}

.tx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin:9px 0;border:1px solid var(--line);box-shadow:var(--shadow)}
.dot{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.dot.gave,.dot.out{background:#f43f5e24;color:var(--red)}.dot.got,.dot.in{background:#10b98124;color:var(--green)}
.tm{flex:1;min-width:0}.tm b,.tm small{display:block}.tm b{font-weight:700}
.ta{font-weight:800}
.ib2{background:var(--inp);border:1px solid var(--line);border-radius:10px;width:33px;height:33px;margin-left:4px}
.empty{text-align:center;color:var(--sub);padding:34px 10px;line-height:1.7}

.login{text-align:center;margin-top:70px;background:var(--card);padding:40px 22px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.login .logo{width:88px;height:88px;margin:0 auto 14px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);box-shadow:0 14px 34px #4f46e577}
.login h2{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.5px}

.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);width:100%;max-width:520px;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(50px);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.overlay.open .sheet{transform:none}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px}}
.sheet h3{margin:0 0 12px;font-size:21px;font-weight:800}
.sheet label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:600}
.sheet input{width:100%;padding:14px;border:1px solid var(--line);background:var(--inp);color:var(--text);border-radius:14px;font-size:16px;outline:0;font-family:inherit}
.sheet input:focus{border-color:var(--pri);box-shadow:0 0 0 3px #6366f133}
.sheet input.bigin{font-size:34px;font-weight:800;text-align:center}
.two{display:flex;gap:10px;margin-top:18px}.two .btn{flex:1}
.mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font-size:16px;font-weight:600;font-family:inherit;padding:16px 6px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#0f172a;color:#fff;border:1px solid #ffffff22;padding:12px 20px;border-radius:26px;z-index:40;font-size:14px;font-weight:600;max-width:90%;box-shadow:0 10px 30px #0006}

.dov{position:fixed;inset:0;background:#000a;z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
.dov.open{opacity:1;pointer-events:auto}
#drawer{width:290px;max-width:84%;height:100%;background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.dov.open #drawer{transform:none}
.dhead{background:linear-gradient(135deg,#4f46e5,#7c3aed,#0ea5e9);color:#fff;padding:30px 18px;margin-bottom:6px}
.dhead small{color:#ffffffcc;display:block}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.cg button{padding:17px 0;font-size:20px;font-weight:700;font-family:inherit;border:1px solid var(--line);border-radius:16px;background:var(--inp);color:var(--text)}
.cg button.op{background:#6366f126;color:var(--pri)}
.cg button.eq{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;border:0}
.cdisp{text-align:right;background:var(--inp);border:1px solid var(--line);border-radius:16px;padding:14px}
.cdisp small{display:block;min-height:16px}.cdisp b{font-size:36px;font-weight:800;word-break:break-all}
</style>
</head>
<body>
<header>
  <button class="ib" id="menuBtn" hidden>☰</button>
  <button class="ib" id="backBtn" hidden>←</button>
  <span id="title">Credit Debit</span>
  <button class="ib" id="searchBtn" hidden>🔍</button>
  <button class="ib" id="bellBtn" hidden>🔔</button>
  <button class="ib" id="delBtn" hidden>🗑</button>
  <button class="ib" id="moreBtn" hidden>⋮</button>
</header>

<main>
  <section id="login" class="login">
    <div class="logo">📒</div>
    <h2>Credit Debit</h2>
    <p style="color:var(--sub);margin:0 0 22px">Your digital ledger.<br>Safe in your own Google account.</p>
    <button class="btn full" id="loginBtn">Continue with Google</button>
  </section>

  <section id="home" hidden>
    <div class="hero home-hero">
      <small>Net balance</small>
      <b class="big" id="sBal">0</b>
      <div class="pills">
        <div class="pill"><small>Total Due</small><b id="sDue" style="color:#ffd1d9">0</b></div>
        <div class="pill"><small>Total Advance</small><b id="sAdv" style="color:#b8f5e1">0</b></div>
      </div>
    </div>
    <div class="search" id="searchBox" hidden><span>🔍</span><input id="search" placeholder="Search customers"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="acc" hidden>
    <div class="hero">
      <div class="av big" id="accAv"></div>
      <small id="accCat"></small>
      <b class="big" id="accBal" style="margin-bottom:2px">0</b>
      <small id="accStatus"></small>
      <div class="actions">
        <button id="call">📞 Call</button>
        <button id="remind">🔔 Remind</button>
        <button id="export">📄 Export</button>
      </div>
    </div>
    <div id="txList"></div>
  </section>

  <section id="txs" hidden>
    <div class="hero"><small>Total entries</small><b class="big" id="txCount" style="margin-bottom:0">0</b></div>
    <div id="txsList"></div>
  </section>

  <section id="cash" hidden>
    <div class="hero">
      <small>Cash balance</small><b class="big" id="cBal">0</b>
      <div class="pills">
        <div class="pill"><small>Cash In</small><b id="cIn" style="color:#b8f5e1">0</b></div>
        <div class="pill"><small>Cash Out</small><b id="cOut" style="color:#ffd1d9">0</b></div>
      </div>
    </div>
    <div id="cashList"></div>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div class="acts">
    <button class="btn soft" id="txBtn">☰ Transactions</button>
    <button class="btn" id="addBtn">👤＋ Add Customer</button>
  </div>
  <nav class="nav">
    <button id="nTransfer"><i>⇄</i>Transfer</button>
    <button id="nCash"><i>💵</i>Cash Book</button>
    <button id="nCalc"><i>🧮</i>Calculator</button>
    <button id="nMore"><i>⋮</i>More</button>
  </nav>
</div>

<div class="bar" id="bar" hidden>
  <button class="btn red" id="gaveBtn">You Gave</button>
  <button class="btn grn" id="gotBtn">You Got</button>
</div>
<div class="bar" id="cbar" hidden>
  <button class="btn grn" id="cashIn">Cash In</button>
  <button class="btn red" id="cashOut">Cash Out</button>
</div>

<div class="dov" id="dov"><aside id="drawer">
  <div class="dhead"><div class="av big" id="dAv"></div><b id="dName"></b><small id="dMail"></small></div>
  <button class="mi" data-go="home">🏠 Home</button>
  <button class="mi" data-go="txs">🧾 Transactions</button>
  <button class="mi" data-go="cash">💵 Cash Book</button>
  <button class="mi" data-go="calc">🧮 Cash Calculator</button>
  <button class="mi" data-go="theme">🌓 Dark / Light mode</button>
  <button class="mi" data-go="logout">⎋ Logout</button>
</aside></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, increment, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAyKcFsblntjAqSD58Q15a1ZHDjjRpsMw",
  authDomain: "creditdebit-app-a33c8.firebaseapp.com",
  projectId: "creditdebit-app-a33c8",
  storageBucket: "creditdebit-app-a33c8.firebasestorage.app",
  messagingSenderId: "782522431758",
  appId: "1:782522431758:web:677034a42d3a62f91eff5f"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("en-IN");
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const nowLocal = () => { const n = new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset()); return n.toISOString().slice(0, 16); };
const color = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg,hsl(${h},70%,55%),hsl(${(h + 40) % 360},70%,42%))`; };
const initial = s => (s || "?").trim().charAt(0).toUpperCase();

let accounts = [], txns = [], cash = [], allTx = [];
let cur = null, unsubA = null, unsubT = null, unsubC = null, filter = "all", catSel = "";

/* theme (dark by default) */
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("theme", t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === "dark" ? "#070b1a" : "#eef1fb";
}
function toggleTheme() { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || "dark");

/* helpers */
const uid = () => auth.currentUser.uid;
const accCol = () => collection(db, "users", uid(), "accounts");
const accRef = id => doc(db, "users", uid(), "accounts", id);
const txCol = () => collection(db, "users", uid(), "accounts", cur, "txns");
const cashCol = () => collection(db, "users", uid(), "cashbook");
function curAcc() { return accounts.find(x => x.id === cur); }

function toast(m) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function openSheet(html) { $("sheet").onclick = null; $("sheet").innerHTML = html; $("overlay").classList.add("open"); }
function closeSheet() { $("overlay").classList.remove("open"); }
$("overlay").onclick = e => { if (e.target === $("overlay")) closeSheet(); };
function confirmBox(msg, okText, fn) {
  openSheet(`<h3>${esc(msg)}</h3><div class="two"><button class="btn ghost" id="no">Cancel</button><button class="btn red" id="yes">${okText}</button></div>`);
  $("no").onclick = closeSheet;
  $("yes").onclick = async () => { closeSheet(); await fn(); };
}
function download(name, csv) {
  const l = document.createElement("a");
  l.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  l.download = name; l.click();
}

/* drawer */
function openDrawer() { $("dov").classList.add("open"); }
function closeDrawer() { $("dov").classList.remove("open"); }
$("menuBtn").onclick = openDrawer;
$("dov").onclick = e => {
  if (e.target === $("dov")) return closeDrawer();
  const b = e.target.closest("[data-go]");
  if (!b) return;
  closeDrawer();
  const k = b.dataset.go;
  if (k === "home") goHome();
  if (k === "txs") openTxs();
  if (k === "cash") openCash();
  if (k === "calc") calcSheet();
  if (k === "theme") toggleTheme();
  if (k === "logout") confirmBox("Logout from your account?", "Logout", () => signOut(auth));
};

/* views */
function view(name) {
  ["login", "home", "acc", "txs", "cash"].forEach(v => $(v).hidden = v !== name);
  $("dock").hidden = name !== "home";
  $("bar").hidden = name !== "acc";
  $("cbar").hidden = name !== "cash";
  const home = name === "home", sub = ["acc", "txs", "cash"].includes(name);
  $("menuBtn").hidden = !home; $("searchBtn").hidden = !home;
  $("bellBtn").hidden = !home; $("moreBtn").hidden = !home;
  $("backBtn").hidden = !sub; $("delBtn").hidden = name !== "acc";
  $("title").textContent = name === "txs" ? "Transactions" : name === "cash" ? "Cash Book" : name === "acc" ? (curAcc() ? curAcc().name : "") : "Credit Debit";
}
function goHome() {
  cur = null;
  if (unsubT) { unsubT(); unsubT = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  view("home");
}
$("backBtn").onclick = goHome;

/* auth */
$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { toast("Login error: " + e.message); }
};
onAuthStateChanged(auth, use
